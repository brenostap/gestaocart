   O número é o herói: separa por espaço e peso, borda leve só entre linhas.
   ========================================================================= */
.tpr-cnt{ font-family:var(--font-mono); font-size:10px; opacity:.6; margin-left:5px; }
.c-chip.ativo .tpr-cnt{ opacity:.85; }

.tpr-wrap{ overflow-x:auto; }
.tpr-tab{ width:100%; border-collapse:collapse; font-size:13px; }
.tpr-tab th{
  position:sticky; top:0; z-index:4;
  padding:8px 14px; background:var(--bg3); text-align:left;
  font-family:var(--font-mono); font-size:10px; font-weight:600;
  text-transform:uppercase; letter-spacing:.07em; color:var(--text4);
  border-bottom:1px solid var(--border); white-space:nowrap;
}
.tpr-tab th.n{ text-align:right; }

/* título da seção (Seminovos / Lacrados) — sticky logo abaixo do cabeçalho */
.tpr-secao td{
  position:sticky; top:30px; z-index:3;
  padding:9px 14px 7px; background:var(--bg2);
  border-top:1px solid var(--border2); border-bottom:1px solid var(--border);
}
.tpr-tab tbody tr.tpr-secao:first-child td{ border-top:none; }
.tpr-secao-nome{ font-size:12px; font-weight:800; color:var(--text); letter-spacing:.04em; text-transform:uppercase; }
.tpr-secao-cnt{ font-family:var(--font-mono); font-size:10px; color:var(--text4); margin-left:9px; }
.tpr-secao-tudo{
  float:right; border:none; background:transparent; cursor:pointer; padding:0;
  font-family:var(--font-mono); font-size:10px; color:var(--text3);
  text-transform:uppercase; letter-spacing:.05em; text-decoration:underline;
}
.tpr-secao-tudo:hover{ color:var(--cart); }

/* linha do modelo — fechada por padrão; é ela que carrega a faixa de preço */
.tpr-grupo td{
  padding:7px 14px; background:var(--bg2); cursor:pointer; user-select:none;
  border-bottom:1px solid var(--border);
}
.tpr-grupo:hover td{ background:var(--bg3); }
.tpr-grupo.aberto td{ background:var(--bg3); }
.tpr-seta{ display:inline-block; width:11px; color:var(--text4); font-size:9px; margin-right:5px;
  transform:rotate(-90deg); transition:transform .15s; }
.tpr-grupo.aberto .tpr-seta{ transform:none; }
/* nome + cores + contagem numa linha só; quebra por item, nunca no meio do nome */
.tpr-mod{ display:flex; align-items:center; flex-wrap:wrap; gap:0 2px; }
.tpr-nome{ font-size:13px; font-weight:700; color:var(--text); letter-spacing:-.01em; white-space:nowrap; }
.tpr-cores{ display:inline-flex; gap:3px; margin-left:9px; vertical-align:middle; }
/* no celular a coluna Upgrade sai da tabela (não cabem 3 colunas de número em
   375px sem cortar o Varejo) e o valor reaparece aqui, embaixo do nome */
.tpr-up-mob{ display:none; font-family:var(--font-mono); font-size:10.5px; color:var(--text4); }
.tpr-up-mob b{ color:var(--text3); font-weight:600; }
.tpr-dot{ width:11px; height:11px; border-radius:50%;
  border:1px solid rgba(0,0,0,.22); box-shadow:inset 0 1px 1px rgba(255,255,255,.25); }
:root[data-theme="dark"] .tpr-dot,
html:not([data-theme="light"]) .tpr-dot{ border-color:rgba(255,255,255,.18); }
.tpr-cap{ font-family:var(--font-mono); font-size:10px; color:var(--text4); margin-left:8px; vertical-align:middle; }
/* separador da faixa de preço: "R$2.950 – 3.550" */
.tpr-ate{ color:var(--text4); font-weight:400; margin:0 3px; }
/* chip informativo NEUTRO — não é alerta (cor = significado, nunca decoração) */
.tpr-varia{ font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text4); background:var(--bg4); padding:1px 6px; border-radius:var(--radius-pill);
  margin-left:10px; vertical-align:middle; }

/* sub-linhas de variante (GB / cor) */
.tpr-lin{ cursor:pointer; }
.tpr-lin td{ padding:5px 14px; border-bottom:1px solid var(--border); color:var(--text2); }
.tpr-lin:hover td{ background:var(--bg3); }
.tpr-lin:hover .tpr-preco.tpr-var{ filter:brightness(1.08); }
.tpr-gb{ font-family:var(--font-mono); font-size:11.5px; color:var(--text3); }
.tpr-gb::before{ content:"↳"; color:var(--text4); margin:0 7px 0 5px; opacity:.55; }
.tpr-dot-lin{ width:10px; height:10px; border-radius:50%; display:inline-block; vertical-align:middle;
  margin:0 6px 0 4px; border:1px solid rgba(0,0,0,.22); }
.tpr-preco{ text-align:right; font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
.tpr-up{ color:var(--text2); }
.tpr-var{ color:var(--cart); }
.tpr-warn{ text-align:center; color:var(--warning); font-size:12px; }

.tpr-nota{ padding:11px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--text4); line-height:1.5; }
.tpr-head-pad{ padding:14px 16px 2px; }

/* painel lateral de detalhe do modelo */
.tpr-pnl-cores{ display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 14px; }
.tpr-pnl-cor{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text2);
  background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-pill); padding:3px 11px 3px 7px; }
.tpr-pnl-nota{ font-size:11.5px; color:var(--text4); margin-top:14px; line-height:1.5; }

@media (max-width:720px){
  .tpr-secao td{ position:static; }   /* sticky duplo atrapalha no celular */
  .tpr-tab th{ position:static; }
  /* no celular a linha do modelo é o alvo do toque: não apertar mais que isso */
  .tpr-grupo td{ padding:9px 12px; }
  .tpr-lin td{ padding:7px 12px; }
  .tpr-col-up{ display:none; }        /* coluna Upgrade vira linha sob o nome */
  .tpr-up-mob{ display:block; margin:2px 0 0 16px; }
  .tpr-lin .tpr-up-mob{ margin-left:32px; }
  .tpr-tab{ font-size:12.5px; }
  .tpr-cap{ margin-left:7px; }
  .tpr-nota{ padding:10px 12px; }
  .tpr-head-pad{ padding:12px 12px 2px; }
}

/* ============================================================================
   CUSTOS — seções por área (vista do mês) e comparativo com o mês anterior
   A tela deixou de ser uma tabela plana: cada área é um card com barra de
   participação e, dentro dele, uma linha por GRUPO (mesma descrição + loja).
   A linha expande para os lançamentos individuais, onde ficam editar/remover.
   ========================================================================= */

/* alternador Mês / vs mês anterior, no cabeçalho da página */
.cst-vista{ display:inline-flex; gap:6px; margin-right:8px; }

/* -- cabeçalho da área ---------------------------------------------------- */
.cst-area-tot{
  font-size:14.5px; font-weight:700; color:var(--text);
  font-variant-numeric:tabular-nums;
}
.cst-area-pct{
  font-family:var(--font-mono); font-size:11px; color:var(--text4);
  margin-left:7px; vertical-align:baseline;
}
.cst-area-barra{ padding:10px 16px 2px; }

/* -- linha de grupo ------------------------------------------------------- */
.cst-grupo{ border-top:1px solid var(--border); }
.cst-grupo:first-of-type{ border-top:none; }
.cst-linha{
  display:grid; grid-template-columns:1fr auto auto; align-items:center;
  gap:14px; padding:9px 16px; cursor:pointer;
  border-left:3px solid transparent; transition:background .12s;
}
.cst-linha:hover{ background:var(--bg3); }
/* identidade da loja — mesmo eixo de cor dos selos .cloja-* */
.cst-linha[data-loja="cart"]{ border-left-color:var(--cart); }
.cst-linha[data-loja="urban"]{ border-left-color:var(--urban); }

.cst-desc{ display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap; }
.cst-nome{ font-size:13.5px; font-weight:600; color:var(--text); }
.cst-tag-mudo{ font-family:var(--font-mono); font-size:10.5px; color:var(--text4); }
.cst-seta{ font-size:11px; color:var(--text4); }
.cst-grupo.aberto .cst-seta{ color:var(--cart); }

.cst-val{
  font-size:13.5px; font-weight:650; color:var(--text);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.cst-val.mudo{ color:var(--text3); font-weight:600; }

/* comparação com o mês anterior, à direita */
.cst-cmp{
  display:flex; flex-direction:column; align-items:flex-end; gap:1px;
  min-width:112px; text-align:right;
}
.cst-ant{ font-family:var(--font-mono); font-size:10.5px; color:var(--text4); white-space:nowrap; }
.cst-delta{
  font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; white-space:nowrap;
}
.cst-delta.sobe{ color:var(--danger); }   /* mais custo */
.cst-delta.cai { color:var(--success); }  /* menos custo */
.cst-delta.igual{ color:var(--text4); font-weight:500; }
.cst-delta-pct{ font-family:var(--font-mono); font-size:10px; opacity:.75; margin-left:5px; }

/* -- lançamentos do grupo (expandido) ------------------------------------- */
.cst-itens{ background:var(--bg3); border-top:1px solid var(--border); padding:4px 0; }
.cst-item{
  display:grid; grid-template-columns:52px 1fr auto auto; align-items:center;
  gap:12px; padding:6px 16px;
}
.cst-item + .cst-item{ border-top:1px solid var(--border); }
.cst-item-data{ font-family:var(--font-mono); font-size:11px; color:var(--text4); }
.cst-item-desc{ font-size:12.5px; color:var(--text2); min-width:0; }
.cst-item-obs{ display:block; font-size:11px; color:var(--text4); margin-top:1px; }
.cst-item-val{ font-size:12.5px; color:var(--text); font-variant-numeric:tabular-nums; }
.cst-item-acoes{ display:flex; gap:2px; }

/* -- bloco "Faltando lançar" ---------------------------------------------- */
.cst-card-alerta{ border-color:var(--warning); }
.cst-card-alerta > .c-card-head{ background:var(--warning-bg); border-bottom-color:var(--warning); }
.cst-card-alerta > .c-card-head .c-card-title,
.cst-card-alerta > .c-card-head .c-card-sub{ color:var(--warning); }
.cst-linha.cst-falta{ cursor:default; border-top:1px solid var(--border); }
.cst-linha.cst-falta:first-child{ border-top:none; }
.cst-linha.cst-falta:hover{ background:transparent; }
.cst-falta-mais{ padding:10px 16px; border-top:1px solid var(--border); }

/* -- comparativo por área (barra divergente) ------------------------------ */
.cst-legenda{
  display:flex; flex-wrap:wrap; gap:16px; align-items:center;
  font-size:11.5px; color:var(--text3); margin-bottom:14px;
}
.cst-dot{ width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:6px; }
.cst-dot.sobe{ background:var(--danger); }
.cst-dot.cai{ background:var(--success); }
.cst-legenda-mudo{ color:var(--text4); }

.cst-cmp-row{
  display:grid; grid-template-columns:180px 1fr 118px; align-items:center;
  gap:16px; padding:9px 0; border-top:1px solid var(--border);
}
.cst-cmp-row:first-of-type{ border-top:none; }
.cst-cmp-lbl{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.cst-cmp-area{ font-size:13px; font-weight:650; color:var(--text); }
.cst-cmp-de-para{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text4);
  font-variant-numeric:tabular-nums;
}
/* trilho com a linha central = mês anterior */
.cst-cmp-track{ position:relative; height:20px; background:var(--bg4); border-radius:var(--radius-sm); }
.cst-cmp-track::before{
  content:''; position:absolute; left:50%; top:-2px; bottom:-2px;
  width:1px; background:var(--border3);
}
.cst-cmp-bar{ position:absolute; top:3px; bottom:3px; border-radius:3px; }
.cst-cmp-bar.sobe{ background:var(--danger); }
.cst-cmp-bar.cai { background:var(--success); }
.cst-cmp-delta{
  text-align:right; font-size:13px; font-weight:650;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.cst-cmp-delta.sobe{ color:var(--danger); }
.cst-cmp-delta.cai { color:var(--success); }
.cst-cmp-delta span{ display:block; font-family:var(--font-mono); font-size:10.5px; font-weight:500; opacity:.8; }
.cst-resumo{
  margin-top:16px; padding-top:14px; border-top:1px solid var(--border);
  font-size:13px; line-height:1.55; color:var(--text2);
}
.cst-resumo b{ color:var(--text); font-weight:650; }

@media (max-width:720px){
  .cst-linha{ grid-template-columns:1fr auto; gap:8px 12px; }
  .cst-cmp{
    grid-column:1 / -1; flex-direction:row; align-items:baseline;
    justify-content:flex-start; gap:10px; min-width:0;
  }
  .cst-item{ grid-template-columns:46px 1fr auto; row-gap:2px; }
  .cst-item-acoes{ grid-column:2 / -1; justify-content:flex-end; }
  .cst-cmp-row{ grid-template-columns:1fr auto; gap:4px 12px; }
  .cst-cmp-track{ grid-column:1 / -1; }
  .cst-vista{ margin-right:0; }
}

/* -- Campo: nota de apoio embaixo do controle ---------------------------- */
.c-field-nota{
  font-size:var(--fs-caption); line-height:var(--lh-caption);
  color:var(--text4); margin-top:4px;
}

/* -- Card de alerta (âmbar = atenção, não erro) -------------------------- */
.c-card-alerta{ border-color:var(--yellow); }
.c-card-alerta .c-card-title{ color:var(--yellow); }
.c-alerta-linha{
  font-size:var(--fs-body); line-height:var(--lh-body); color:var(--text2);
  padding:7px 0; border-bottom:1px solid var(--border);
}
.c-alerta-linha:last-child{ border-bottom:none; padding-bottom:0; }

/* -- Escolha do PDF de fechamento (modal) ------------------------------- */
.fp-escolha{ display:flex; flex-direction:column; gap:10px; }
.fp-escolha .c-btn{ justify-content:space-between; width:100%; text-align:left; }
.fp-escolha .c-btn span{ font-size:var(--fs-caption); opacity:.75; font-weight:400; }
.fp-escolha-sep{
  font-size:var(--fs-caption); color:var(--text4); text-align:center;
  text-transform:uppercase; letter-spacing:.08em; margin-top:4px;
}
.fp-escolha-grade{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
@media (max-width:420px){ .fp-escolha-grade{ grid-template-columns:1fr; } }

/* -- Faixa "nova versão" (cache do ícone no iOS serve código velho) ------ */
.c-faixa-versao{
  position:fixed; left:0; right:0; bottom:0; z-index:10000;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--yellow-bg); border-top:1px solid var(--yellow);
  box-shadow:var(--shadow-lg);
}
.c-faixa-versao-txt{
  flex:1; min-width:180px;
  font-size:var(--fs-caption); line-height:var(--lh-caption); color:var(--ink);
}
.c-faixa-versao-txt b{ color:var(--yellow); }
@media print{ .c-faixa-versao{ display:none !important; } }

<script>// ============================================================================
// UI — vocabulario de componentes do Cart System
//
// As telas devem PEDIR componentes em vez de escrever estilo inline. Assim um
// ajuste de token ou de espacamento vale para o sistema inteiro, em vez de
// exigir busca-e-substitui em 566 lugares.
//
//   UI.card({titulo, sub, acao, corpo})
//   UI.kpi({rotulo, valor, sub, tom})   UI.kpis([...])
//   UI.badge(texto, tom)
//   UI.tabela({colunas, linhas, vazio})
//   UI.vazio({ico, titulo, texto, acao})
//   UI.btn(texto, {onclick, variante, sm})
//   UI.chip(texto, ativo, onclick)
//   UI.barra(pct, tom)
//   UI.kv(chave, valor)
//   UI.painel({titulo, corpo, onFechar})
//
// tom: 'ok' | 'alerta' | 'critico' | 'processo' | 'marca' | undefined
// ============================================================================

const UI = {

  esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  },

  _tom(t){ return t ? ` data-tom="${t}"` : ''; },

  // -- Card ---------------------------------------------------------------
  card({titulo, sub, acao, corpo, flush, classe} = {}){
    const cabecalho = (titulo || acao) ? `
      <div class="c-card-head">
        ${titulo ? `<div class="c-card-title">${titulo}${sub ? ` <span class="c-card-sub">${sub}</span>` : ''}</div>` : ''}
        ${acao ? `<div class="c-card-action">${acao}</div>` : ''}
      </div>` : '';
    return `<div class="c-card${classe ? " "+classe : ""}">${cabecalho}
      <div class="c-card-body${flush ? ' flush' : ''}">${corpo || ''}</div>
    </div>`;
  },

  // -- KPI ----------------------------------------------------------------
  kpi({rotulo, valor, sub, tom} = {}){
    return `<div class="c-kpi"${this._tom(tom)}>
      <span class="c-kpi-label">${rotulo || ''}</span>
      <span class="c-kpi-value">${valor == null ? '—' : valor}</span>
      ${sub ? `<span class="c-kpi-sub">${sub}</span>` : ''}
    </div>`;
  },
  kpis(lista){ return `<div class="c-kpi-grid">${(lista||[]).map(k => this.kpi(k)).join('')}</div>`; },

  // -- Badge --------------------------------------------------------------
  badge(texto, tom, mono){
    return `<span class="c-badge${mono ? ' c-badge-mono' : ''}"${this._tom(tom)}>${texto}</span>`;
  },

  // -- Badge de forma de pagamento ----------------------------------------
  // Eixo de cor proprio (data-forma), nao os tons semanticos. Normaliza o nome
  // cru da FoneNinja ("Pix MercadoPago", "Crédito"...) para chave + rotulo curto.
  // Forma nao reconhecida vira badge neutro com o texto original.
  badgePagto(forma){
    const raw = String(forma == null ? '' : forma).toLowerCase();
    let key = '', label = forma || '—';
    if(raw.includes('pix'))                          { key = 'pix';      label = 'Pix'; }
    else if(raw.includes('créd') || raw.includes('cred')) { key = 'credito';  label = 'Crédito'; }
    else if(raw.includes('déb')  || raw.includes('deb'))  { key = 'debito';   label = 'Débito'; }
    else if(raw.includes('dinh'))                    { key = 'dinheiro'; label = 'Dinheiro'; }
    return `<span class="c-badge"${key ? ` data-forma="${key}"` : ''}>${this.esc(label)}</span>`;
  },

  // -- Tabela -------------------------------------------------------------
  // colunas: [{titulo, num, largura}]
  // linhas:  [[celula, ...]]  — celula pode ser string ou {v, num, classe}
  // onLinha: recebe o indice e devolve o codigo do onclick da <tr>
  tabela({colunas = [], linhas = [], vazio, onLinha} = {}){
    if(!linhas.length){
      return vazio || this.vazio({titulo:'Nada por aqui', texto:'Não há registros para este filtro.'});
    }
    const th = colunas.map(c =>
      `<th class="${c.num ? 'num' : ''}"${c.largura ? ` style="width:${c.largura}"` : ''}>${c.titulo || ''}</th>`).join('');
    const tr = linhas.map((l, li) => `<tr${onLinha ? ` class="clicavel" onclick="${onLinha(li)}"` : ''}>${l.map((cel, i) => {
      const o = (cel && typeof cel === 'object') ? cel : {v: cel};
      const num = o.num !== undefined ? o.num : (colunas[i] && colunas[i].num);
      return `<td class="${num ? 'num ' : ''}${o.classe || ''}">${o.v == null ? '—' : o.v}</td>`;
    }).join('')}</tr>`).join('');
    return `<div class="c-tabela-wrap"><table class="c-tabela">
      <thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
  },

  // -- Estado vazio (sempre diz o proximo passo, brief §7.5) --------------
  vazio({ico, titulo, texto, acao} = {}){
    return `<div class="c-vazio">
      ${ico ? `<div class="c-vazio-ico">${ico}</div>` : ''}
      <div class="c-vazio-titulo">${titulo || 'Nada por aqui'}</div>
      ${texto ? `<div class="c-vazio-texto">${texto}</div>` : ''}
      ${acao || ''}
    </div>`;
  },

  // -- Botao / chip -------------------------------------------------------
  btn(texto, {onclick, variante, sm, id, titulo, disabled} = {}){
    return `<button class="c-btn${variante ? ' '+variante : ''}${sm ? ' c-btn-sm' : ''}"
      ${id ? `id="${id}"` : ''} ${onclick ? `onclick="${onclick}"` : ''}
      ${titulo ? `title="${this.esc(titulo)}"` : ''} ${disabled ? 'disabled' : ''}>${texto}</button>`;
  },
  chip(texto, ativo, onclick){
    return `<button class="c-chip${ativo ? ' ativo' : ''}" onclick="${onclick}">${texto}</button>`;
  },
  toolbar(...partes){ return `<div class="c-toolbar">${partes.filter(Boolean).join('')}</div>`; },
  sep(){ return '<div class="c-sep"></div>'; },

  // -- Barra de progresso -------------------------------------------------
  barra(pct, tom){
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    return `<div class="c-barra"><div class="c-barra-fill"${this._tom(tom)} style="width:${p}%"></div></div>`;
  },

  // -- Linha chave/valor --------------------------------------------------
  kv(chave, valor){
    return `<div class="c-kv"><span class="c-kv-k">${chave}</span><span class="c-kv-v">${valor == null ? '—' : valor}</span></div>`;
  },

  // -- Painel lateral (vira sheet no celular) -----------------------------
  painel({titulo, corpo, onFechar} = {}){
    // Sem aspas duplas: o handler vai dentro de onclick="…" (aspas duplas). Usar
    // aspas duplas aqui cortava o atributo no meio e quebrava o botao de fechar.
    const fechar = onFechar || 'UI.fecharPainel()';
    return `<div class="c-painel-overlay" onclick="if(event.target===this){${fechar}}">
      <div class="c-painel">
        <div class="c-painel-head">
          <div class="c-card-title">${titulo || ''}</div>
          <div class="c-card-action">${this.btn('✕', {onclick: fechar, variante:'sutil', sm:true})}</div>
        </div>
        <div class="c-painel-body">${corpo || ''}</div>
      </div>
    </div>`;
  },

  abrirPainel(opts){
    document.querySelector('.c-painel-overlay')?.remove();
    document.body.insertAdjacentHTML('beforeend', this.painel(opts));
  },
  fecharPainel(){ document.querySelector('.c-painel-overlay')?.remove(); },

  // -- Campos de formulario -----------------------------------------------
  // Tela nova nao escreve <input> na mao: pede UI.campo(...) (brief §1).
  campo({label, corpo} = {}){
    return `<div class="c-field">
      ${label ? `<span class="c-field-label">${label}</span>` : ''}
      ${corpo || ''}
    </div>`;
  },
  input({id, tipo, valor, placeholder, extra} = {}){
    return `<input class="c-input" id="${id}" type="${tipo || 'text'}"
      value="${valor == null ? '' : this.esc(valor)}"
      ${placeholder ? `placeholder="${this.esc(placeholder)}"` : ''} ${extra || ''}>`;
  },
  select({id, opcoes = [], valor} = {}){
    const opts = opcoes.map(o => {
      const v = (o && typeof o === 'object') ? o.v : o;
      const t = (o && typeof o === 'object') ? o.t : o;
      return `<option value="${this.esc(v)}"${String(v) === String(valor) ? ' selected' : ''}>${t}</option>`;
    }).join('');
    return `<select class="c-select" id="${id}">${opts}</select>`;
  },
  linha(...campos){ return `<div class="c-field-row${campos.length > 1 ? ' dois' : ''}">${campos.join('')}</div>`; },

  // -- Modal central (acao focada: criar/editar) --------------------------
  modal({titulo, corpo, foot, id, onFechar} = {}){
    const fechar = onFechar || 'UI.fecharModal()';
    return `<div class="c-modal-overlay" ${id ? `id="${id}"` : ''} onclick="if(event.target===this){${fechar}}">
      <div class="c-modal">
        <div class="c-modal-head">
          <div class="c-modal-title">${titulo || ''}</div>
          ${this.btn('✕', {onclick: fechar, variante:'sutil', sm:true})}
        </div>
        <div class="c-modal-body">${corpo || ''}</div>
        ${foot ? `<div class="c-modal-foot">${foot}</div>` : ''}
      </div>
    </div>`;
  },
  abrirModal(opts){
    this.fecharModal();
    document.body.insertAdjacentHTML('beforeend', this.modal(opts));
  },
  fecharModal(){ document.querySelector('.c-modal-overlay')?.remove(); },
};

function abrir(etq){ ABERTO = (ABERTO===etq ? null : etq); pinta(); }

document.getElementById('bt-e').onclick = () => { TELA='estoque'; marca(); pinta(); };

  document.getElementById('bt-v').classList.toggle('active', TELA==='vendas');
  document.getElementById('bt-e').classList.toggle('active', TELA==='estoque');
}
